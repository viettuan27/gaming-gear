services:
  redis_gaming:
    image: redis:7-alpine
    container_name: redis_gaming
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres_gaming:
    image: postgres:17.11-alpine
    container_name: postgres_gaming
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_gaming:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio_gaming:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio_gaming
    networks:
      default:
        aliases:
          - minio-gaming
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_gaming:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api_gaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming_gear_api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres_gaming
      POSTGRES_HOST_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis_gaming
      REDIS_HOST_PORT: 6379
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      MINIO_ENDPOINT: http://minio-gaming:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RATE_LIMIT_LOGIN_IP_LIMIT: ${RATE_LIMIT_LOGIN_IP_LIMIT:-20}
      RATE_LIMIT_LOGIN_ACCOUNT_LIMIT: ${RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:-8}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-1m}
      RATE_LIMIT_REGISTER_IP_LIMIT: ${RATE_LIMIT_REGISTER_IP_LIMIT:-5}
      RATE_LIMIT_REGISTER_ACCOUNT_LIMIT: ${RATE_LIMIT_REGISTER_ACCOUNT_LIMIT:-3}
      RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-1h}
      RATE_LIMIT_REFRESH_IP_LIMIT: ${RATE_LIMIT_REFRESH_IP_LIMIT:-30}
      RATE_LIMIT_REFRESH_WINDOW: ${RATE_LIMIT_REFRESH_WINDOW:-1m}
      RATE_LIMIT_UPLOAD_USER_LIMIT: ${RATE_LIMIT_UPLOAD_USER_LIMIT:-30}
      RATE_LIMIT_UPLOAD_IP_LIMIT: ${RATE_LIMIT_UPLOAD_IP_LIMIT:-60}
      RATE_LIMIT_UPLOAD_WINDOW: ${RATE_LIMIT_UPLOAD_WINDOW:-1m}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres_gaming:
        condition: service_healthy
      redis_gaming:
        condition: service_healthy
      minio_gaming:
        condition: service_healthy
    restart: unless-stopped

  storefront_gaming:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_TARGET: storefront
        VITE_API_BASE_URL: /api/v1
        VITE_STOREFRONT_URL: http://localhost:${STOREFRONT_HOST_PORT:-5173}
    container_name: gaming_gear_storefront
    ports:
      - "${STOREFRONT_HOST_PORT:-5173}:80"
    depends_on:
      - api_gaming
    restart: unless-stopped

  admin_gaming:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_TARGET: admin
        VITE_API_BASE_URL: /api/v1
        VITE_STOREFRONT_URL: http://localhost:${STOREFRONT_HOST_PORT:-5173}
    container_name: gaming_gear_admin
    ports:
      - "${ADMIN_HOST_PORT:-5174}:80"
    depends_on:
      - api_gaming
    restart: unless-stopped

volumes:
  postgres_gaming:
  minio_gaming:
