services:
  postgres_test:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: gaming_gear_test
      POSTGRES_USER: gaming_test
      POSTGRES_PASSWORD: gaming_test_password
    ports:
      - "127.0.0.1:15436:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming_test -d gaming_gear_test"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis_test:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio_test:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testadmin
      MINIO_ROOT_PASSWORD: testpassword123
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_test_data:
  minio_test_data: