spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_HOST_PORT:5436}/${POSTGRES_DB:gaming_gear_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_HOST_PORT:6380}

  cache:
    type: redis
    cache-names:
      - categories
      - brands
      - product-list
      - product-detail

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  public-url: ${MINIO_PUBLIC_URL}
  bucket: ${MINIO_BUCKET}

security:
  rate-limit:
    login:
      ip-limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
      account-limit: ${RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:8}
      window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
    register:
      ip-limit: ${RATE_LIMIT_REGISTER_IP_LIMIT:5}
      account-limit: ${RATE_LIMIT_REGISTER_ACCOUNT_LIMIT:3}
      window: ${RATE_LIMIT_REGISTER_WINDOW:1h}
    refresh:
      ip-limit: ${RATE_LIMIT_REFRESH_IP_LIMIT:30}
      window: ${RATE_LIMIT_REFRESH_WINDOW:1m}
    upload:
      user-limit: ${RATE_LIMIT_UPLOAD_USER_LIMIT:30}
      ip-limit: ${RATE_LIMIT_UPLOAD_IP_LIMIT:60}
      window: ${RATE_LIMIT_UPLOAD_WINDOW:1m}

logging:
  level:
    org.hibernate.SQL: debug
